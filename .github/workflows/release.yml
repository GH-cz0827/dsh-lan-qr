name: release

# Tag a release (`git tag v1.0.0 && git push --tags`) and this workflow:
#   1. verifies the package manifest and the bundle patch parse,
#   2. packs the npm tarball,
#   3. attaches it to the GitHub Release (dshmarket prefers this prebuilt path).
# It does not publish to npm; run `npm publish` yourself (or add a NPM_TOKEN and
# enable the commented step).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sanity check manifest and patch
        run: |
          node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) throw new Error('dsh.bundle.patch missing'); if(!p.dsh?.client) throw new Error('dsh.client missing'); if(!p.exports?.['./client']) throw new Error('exports ./client missing'); console.log(p.name, p.version)"
          node -e "const fs=require('fs'); const y=fs.readFileSync('cordis.patch.yml','utf8'); if(!/insert:/.test(y)) throw new Error('patch has no insert list'); console.log('patch ok')"

      - name: Pack tarball
        run: npm pack --silent

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tgz'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - name: Publish to npm
      #   run: npm publish --access public
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
